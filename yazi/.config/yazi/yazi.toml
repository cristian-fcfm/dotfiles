[mgr]
ratio          = [ 1, 4, 3 ]
sort_dir_first = true
linemode       = "size"
show_hidden    = true

[opener]
edit = [
  { run = 'nvim %s', desc = "Neovim", block = true },
]
reveal = [
  { run = 'xdg-open %d1', desc = "Reveal in file manager", for = "linux" },
  { run = 'open -R %s1',  desc = "Reveal in Finder",       for = "macos" },
]
open = [
  { run = 'xdg-open %s', desc = "Open", for = "linux" },
  { run = 'open %s',     desc = "Open", for = "macos" },
]
text = [
  { run = 'nvim %s', desc = "Neovim", block = true },
]
image = [
  { run = 'xdg-open %s', desc = "Open", for = "linux" },
  { run = 'open %s',     desc = "Open", for = "macos" },
]
video = [
  { run = 'mpv %s', desc = "mpv", orphan = true },
]
firefox = [
  { run = 'open -b org.mozilla.firefox %s', desc = "Firefox", for = "macos" },
  { run = 'firefox %s',                     desc = "Firefox", for = "linux" },
]
archive = [
  { run = 'ouch decompress --yes %s', desc = "Extract archive (ouch)", block = true },
]

[open]
rules = [
  # Archivos de texto y código
  { url = "*.{md,py,sql,jinja,jinja2,j2,sh,bash,lua,toml,yaml,yml,json,conf,txt,vim}", use = ["text", "reveal"] },

  # Multimedia
  { mime = "image/*", use = ["image", "reveal"] },
  { mime = "video/*", use = ["video", "reveal"] },

  # PDFs y HTML en el navegador
  { url = "*.{pdf,html}", use = ["firefox", "reveal"] },

  # Archivos comprimidos
  { url = "*.{tar.gz,tar.xz,zip,7z,rar}", use = ["archive", "reveal"] },

  # Por defecto
  { url = "*", use = ["open", "reveal"] },
]

[log]
enabled = false

[input]
cursor_blink = false

[select]
open_offset = "auto"

