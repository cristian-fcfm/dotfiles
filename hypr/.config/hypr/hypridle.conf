# =============================================================================
# HYPRIDLE — bloqueo y DPMS por inactividad
# =============================================================================
# Lo arranca systemd (hypridle.service, WantedBy=graphical-session.target).
# Sin listener de suspend: equipo de escritorio.

general {
    lock_cmd = pidof hyprlock || hyprlock   # una sola instancia de hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# --- 10 min: bloquear --------------------------------------------------------
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# --- 15 min: apagar monitores ------------------------------------------------
# Vuelven a encenderse con cualquier actividad.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
