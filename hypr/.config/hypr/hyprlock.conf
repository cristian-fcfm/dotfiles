# =============================================================================
# HYPRLOCK — pantalla de bloqueo
# =============================================================================

general {
    hide_cursor = true
}

# --- Fondo -------------------------------------------------------------------
background {
    monitor =
    path = ~/.wallpapers/berserk.png
    blur_passes = 3
    blur_size = 6
}

# --- Reloj -------------------------------------------------------------------
label {
    monitor =
    text = $TIME
    color = rgb(dcd7ba)
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}

# --- Contraseña --------------------------------------------------------------
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(7e9cd8)
    inner_color = rgb(1f1f28)
    font_color = rgb(dcd7ba)
    check_color = rgb(957fb8)
    fail_color = rgb(c34043)
    fade_on_empty = false
    placeholder_text = <i>Contraseña</i>
    fail_text = <i>$FAIL</i>
    position = 0, -40
    halign = center
    valign = center
}
